name: Build HoloBox SD Card Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-sd-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binfmt-support parted kpartx zip wget curl xz-utils

    - name: Download RPi OS Lite 64
      run: |
        wget -O rpi-os-lite.img.xz https://downloads.raspberrypi.org/raspios_lite_arm64/images/raspios_lite_arm64-2024-03-15/2024-03-15-raspios-bookworm-arm64-lite.img.xz
        xz -d rpi-os-lite.img.xz

    - name: Expand image
      run: |
        dd if=/dev/zero bs=1M count=2048 >> rpi-os-lite.img
        sudo losetup -P /dev/loop0 rpi-os-lite.img
        sudo parted /dev/loop0 resizepart 2 100%
        # Force filesystem check with automatic yes to all questions, ignore errors
        sudo e2fsck -f -y -v /dev/loop0p2 || echo "e2fsck completed with warnings/errors, continuing..."
        sudo resize2fs /dev/loop0p2

    - name: Mount / chroot
      run: |
        mkdir -p /tmp/rpi-root
        sudo mount /dev/loop0p2 /tmp/rpi-root
        sudo mount /dev/loop0p1 /tmp/rpi-root/boot
        sudo cp /usr/bin/qemu-aarch64-static /tmp/rpi-root/usr/bin/
        sudo mount -t proc proc /tmp/rpi-root/proc
        sudo mount -t sysfs sysfs /tmp/rpi-root/sys
        sudo mount --bind /dev /tmp/rpi-root/dev
        sudo mount --bind /dev/pts /tmp/rpi-root/dev/pts

        sudo mkdir -p /tmp/rpi-root/opt/holobox-install
        sudo cp -r Software/* /tmp/rpi-root/opt/holobox-install/

    - name: Install in chroot
      run: |
        cat <<'CHROOT' | sudo tee /tmp/rpi-root/install_holobox.sh
        #!/usr/bin/env bash
        set -e

        echo "nameserver 8.8.8.8" > /etc/resolv.conf
        apt-get update
        # Install build dependencies for Python packages including libcap-dev for python-prctl
        apt-get install -y python3 python3-pip hostapd dnsmasq iptables-persistent wpasupplicant git curl wget \
                          build-essential libcap-dev pkg-config python3-dev python3-picamera2 

        # Create pi user and configure properly for Raspberry Pi OS
        useradd -m -s /bin/bash pi || true
        usermod -aG sudo pi || true
        echo "pi:youseetoo" | chpasswd
        
        # Disable first-time user setup to prevent username prompt on boot
        systemctl disable userconfig || true
        
        # Create userconf.txt for boot partition to configure user
        echo "pi:\$6\$rounds=656000\$YQKNpEXgsKpKhJoY\$u2LpKU3xd5JchlREtd/qXhBUOEIgM/gDp0tOk3gGnfEh76VjZcB6g7wXP2.7v3vA.T8u6pzOgKaFEaVZQMdtX0" > /boot/userconf.txt

        mkdir -p /opt/holobox
        chown pi:pi /opt/holobox
        cp -r /opt/holobox-install/* /opt/holobox/
        chown -R pi:pi /opt/holobox
        chmod +x /opt/holobox/*.sh

        cd /opt/holobox
        pip install fastapi==0.110.0 uvicorn[standard]==0.29.0 numpy==1.26.4 opencv-python-headless==4.10.0.82 pydantic==2.7.1 --break-system-packages  

        # ensure we have the right numpy version and reinstall picamera again
        pip install picamera2 --force-reinstall --break-system-packages
        pip install numpy==1.26.4 --break-system-packages
        
        mkdir -p /var/log/holobox
        chown pi:pi /var/log/holobox

        cat <<'UNIT' > /etc/systemd/system/holobox-camera.service
        [Unit]
        Description=HoloBox Camera API Server
        After=network.target

        [Service]
        Type=simple
        User=pi
        WorkingDirectory=/opt/holobox
        ExecStart=python /opt/holobox/streamlined_camera_api.py --host 0.0.0.0 --port 8001
        Restart=on-failure
        RestartSec=5
        StandardOutput=append:/var/log/holobox/camera.log
        StandardError=append:/var/log/holobox/camera.log

        [Install]
        WantedBy=multi-user.target
        UNIT

        systemctl daemon-reload
        systemctl enable holobox-camera.service
        systemctl enable ssh

        # ---------- embedded scripts ----------
        
        # Create SSID generator script first
        cat <<'SSIDGEN' > /opt/holobox/generate_ssid.py
        #!/usr/bin/env python3
        """
        HoloBox SSID Generator
        Generates unique SSID names based on MAC address using dictionary lookup
        Format: openUC2-NAME1-NAME2
        """
        
        import hashlib
        import subprocess
        import sys
        
        
        # Name dictionaries for the lookup table
        ADJECTIVES = [
            "Bright", "Clear", "Focus", "Sharp", "Zoom", "Light", "Flash", "Lens", 
            "Image", "Photo", "Pixel", "Frame", "View", "Scope", "Beam", "Wave",
            "Crystal", "Prism", "Filter", "Mirror", "Optic", "Laser", "Holo", "Ray",
            "Spectrum", "Digital", "Micro", "Macro", "Ultra", "Super", "Nano", "Mini"
        ]
        
        NOUNS = [
            "Box", "Cam", "Lab", "Scope", "Lens", "Beam", "Wave", "Light", "Focus",
            "View", "Snap", "Shot", "Frame", "Pixel", "Image", "Photo", "Optic",
            "Prism", "Mirror", "Filter", "Ray", "Laser", "Holo", "Spectrum", "Micro",
            "Macro", "Unit", "Device", "System", "Tool", "Cube", "Capsule", "Pod"
        ]
        
        
        def get_mac_address(interface='wlan0'):
            """Get MAC address of specified network interface"""
            try:
                # Try to read MAC from /sys/class/net
                with open(f'/sys/class/net/{interface}/address', 'r') as f:
                    mac = f.read().strip()
                    return mac
            except FileNotFoundError:
                try:
                    # Fallback: try to get MAC using ip command
                    result = subprocess.run(['ip', 'link', 'show', interface], 
                                          capture_output=True, text=True)
                    if result.returncode == 0:
                        for line in result.stdout.split('\n'):
                            if 'link/ether' in line:
                                mac = line.split()[1]
                                return mac
                except Exception:
                    pass
            
            # If all else fails, generate a fallback based on hostname
            try:
                result = subprocess.run(['hostname'], capture_output=True, text=True)
                hostname = result.stdout.strip()
                # Create a pseudo-MAC from hostname
                mac_hash = hashlib.md5(hostname.encode()).hexdigest()[:12]
                mac = ':'.join([mac_hash[i:i+2] for i in range(0, 12, 2)])
                return mac
            except Exception:
                # Ultimate fallback
                return "00:00:00:00:00:01"
        
        
        def mac_to_indices(mac_address):
            """Convert MAC address to lookup table indices"""
            # Remove colons and convert to bytes
            mac_bytes = bytes.fromhex(mac_address.replace(':', ''))
            
            # Create hash for more even distribution
            hash_bytes = hashlib.sha256(mac_bytes).digest()
            
            # Use first 4 bytes to generate indices
            adj_index = (hash_bytes[0] << 8 | hash_bytes[1]) % len(ADJECTIVES)
            noun_index = (hash_bytes[2] << 8 | hash_bytes[3]) % len(NOUNS)
            
            return adj_index, noun_index
        
        
        def generate_ssid(interface='wlan0'):
            """Generate SSID in format openUC2-NAME1-NAME2"""
            mac_address = get_mac_address(interface)
            adj_index, noun_index = mac_to_indices(mac_address)
            
            adjective = ADJECTIVES[adj_index]
            noun = NOUNS[noun_index]
            
            ssid = f"openUC2-{adjective}-{noun}"
            return ssid
        
        
        def main():
            """Command line interface"""
            if len(sys.argv) > 1:
                interface = sys.argv[1]
            else:
                interface = 'wlan0'
            
            mac = get_mac_address(interface)
            ssid = generate_ssid(interface)
            
            print(f"Interface: {interface}")
            print(f"MAC Address: {mac}")
            print(f"Generated SSID: {ssid}")
            
            return ssid
        
        
        if __name__ == "__main__":
            main()
        SSIDGEN
        chmod +x /opt/holobox/generate_ssid.py

        cat <<'AP' > /opt/holobox/setup_access_point.sh
        #!/usr/bin/env bash
        # Setup Raspberry Pi as WiFi Access Point for HoloBox
        # Source: setup_access_point.sh :contentReference[oaicite:0]{index=0}
        set -e
        # Default configuration  
        INTERFACE="wlan0"
        IP_RANGE="192.168.4.0/24"
        GATEWAY="192.168.4.1"
        PASSPHRASE="holobox123"
        
        # Generate MAC-based SSID using the generate_ssid.py script
        SCRIPT_DIR="$(dirname "$(readlink -f "$0")")"
        if [ -f "$SCRIPT_DIR/generate_ssid.py" ]; then
            SSID=$(python3 "$SCRIPT_DIR/generate_ssid.py" "$INTERFACE" | tail -n 1 | cut -d' ' -f3)
        else
            # Fallback if script is not available
            SSID="openUC2-$(hostname | tail -c 5)"
        
        echo "Setting up HoloBox Access Point..."
        echo "SSID: $SSID"
        echo "Interface: $INTERFACE"
        echo "IP Range: $IP_RANGE"
        
        # Check if NetworkManager is active and configure it properly
        if systemctl is-active --quiet NetworkManager; then
            echo "Configuring NetworkManager for hotspot mode..."
            # Stop any existing connections on wlan0
            nmcli device disconnect "$INTERFACE" 2>/dev/null || true
            # Set interface to unmanaged temporarily during setup
            sudo tee /etc/NetworkManager/conf.d/99-unmanaged-devices.conf >/dev/null <<EOF
        [keyfile]
        unmanaged-devices=interface-name:$INTERFACE
        EOF
            sudo systemctl reload NetworkManager
            sleep 2
        fi
        
        # Stop conflicting services
        sudo systemctl stop hostapd dnsmasq wpa_supplicant 2>/dev/null || true

        sudo apt-get update
        sudo apt-get install -y hostapd dnsmasq
        sudo systemctl stop hostapd dnsmasq

        sudo tee /etc/dhcpcd.conf.holobox >/dev/null <<EOF
        interface $INTERFACE
            static ip_address=$GATEWAY/24
            nohook wpa_supplicant
        EOF
        sudo cp /etc/dhcpcd.conf /etc/dhcpcd.conf.backup 2>/dev/null || true
        sudo cp /etc/dhcpcd.conf.holobox /etc/dhcpcd.conf

        sudo tee /etc/dnsmasq.conf.holobox >/dev/null <<EOF
        # HoloBox Access Point DNS/DHCP configuration
        interface=$INTERFACE
        dhcp-range=192.168.4.2,192.168.4.20,255.255.255.0,24h
        domain=holobox.local
        local=/holobox.local/
        # Prevent dnsmasq from using /etc/resolv.conf
        no-resolv
        # Use Google DNS for upstream
        server=8.8.8.8
        server=8.8.4.4
        EOF
        sudo cp /etc/dnsmasq.conf /etc/dnsmasq.conf.backup 2>/dev/null || true
        sudo cp /etc/dnsmasq.conf.holobox /etc/dnsmasq.conf

        sudo tee /etc/hostapd/hostapd.conf >/dev/null <<EOF
        interface=$INTERFACE
        driver=nl80211
        ssid=$SSID
        hw_mode=g
        channel=7
        wmm_enabled=0
        macaddr_acl=0
        auth_algs=1
        ignore_broadcast_ssid=0
        wpa=2
        wpa_passphrase=$PASSPHRASE
        wpa_key_mgmt=WPA-PSK
        wpa_pairwise=TKIP
        rsn_pairwise=CCMP
        EOF
        sudo tee /etc/default/hostapd >/dev/null <<EOF
        DAEMON_CONF="/etc/hostapd/hostapd.conf"
        EOF

        echo 'net.ipv4.ip_forward=1' | sudo tee -a /etc/sysctl.conf
        # Configure iptables with better error handling
        sudo iptables -t nat -F POSTROUTING 2>/dev/null || true
        sudo iptables -F FORWARD 2>/dev/null || true
        sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
        sudo iptables -A FORWARD -i eth0 -o $INTERFACE -m state --state RELATED,ESTABLISHED -j ACCEPT
        sudo iptables -A FORWARD -i $INTERFACE -o eth0 -j ACCEPT
        sudo sh -c "iptables-save > /etc/iptables.ipv4.nat"

        sudo tee /etc/systemd/system/restore-iptables.service >/dev/null <<EOF
        [Unit]
        Description=Restore iptables rules
        After=network.target
        [Service]
        Type=oneshot
        ExecStart=/sbin/iptables-restore /etc/iptables.ipv4.nat
        RemainAfterExit=yes
        [Install]
        WantedBy=multi-user.target
        EOF

        sudo systemctl daemon-reload
        sudo systemctl enable hostapd dnsmasq restore-iptables
        echo "Access Point ready; reboot to activate."
        AP
        chmod +x /opt/holobox/setup_access_point.sh

        # Create additional hotspot service for better startup management
        cat <<'HOTSPOT_SERVICE' > /etc/systemd/system/holobox-hotspot.service
        [Unit]
        Description=HoloBox WiFi Hotspot Setup
        After=network.target dhcpcd.service
        Before=hostapd.service dnsmasq.service
        
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStartPre=/bin/sleep 5
        ExecStart=/bin/bash -c 'ip addr add 192.168.4.1/24 dev wlan0 || true'
        ExecStart=/bin/bash -c 'ip link set wlan0 up'
        ExecStartPost=/bin/bash -c 'echo "Hotspot setup complete, IP: $(ip addr show wlan0 | grep "inet " | awk "{print $2}")"'
        
        [Install]
        WantedBy=multi-user.target
        HOTSPOT_SERVICE
        systemctl enable holobox-hotspot.service

        cat <<'WIFI' > /opt/holobox/setup_wifi_client.sh
        #!/usr/bin/env bash
        # Configure Raspberry Pi to connect to external WiFi
        # Source: setup_wifi_client.sh :contentReference[oaicite:1]{index=1}
        set -e
        SSID=""
        PASSPHRASE=""
        while [[ $# -gt 0 ]]; do
          case $1 in
            --ssid) SSID="$2"; shift 2 ;;
            --password) PASSPHRASE="$2"; shift 2 ;;
            *) echo "Usage: $0 --ssid NET --password PASS"; exit 1 ;;
          esac
        done
        if [[ -z "$SSID" || -z "$PASSPHRASE" ]]; then
          echo "SSID and password required"; exit 1
        fi
        sudo systemctl stop hostapd dnsmasq || true
        sudo systemctl disable hostapd dnsmasq || true
        [[ -f /etc/dhcpcd.conf.backup ]] && sudo cp /etc/dhcpcd.conf.backup /etc/dhcpcd.conf
        sudo tee /etc/wpa_supplicant/wpa_supplicant.conf >/dev/null <<EOF
        country=US
        ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
        update_config=1
        network={
          ssid="$SSID"
          psk="$PASSPHRASE"
        }
        EOF
        sudo systemctl enable wpa_supplicant
        echo "Client WiFi configured; reboot recommended."
        WIFI
        chmod +x /opt/holobox/setup_wifi_client.sh

        cat <<'REG' > /opt/holobox/registerservice.sh
        #!/usr/bin/env bash
        # register and start HoloBox camera API as a systemd service
        # Source: registerservice.sh :contentReference[oaicite:2]{index=2}
        SERVICE=holobox-camera.service
        sudo bash -c "cat >/etc/systemd/system/$SERVICE" <<'UNIT'
        [Unit]
        Description=HoloBox Camera API Server
        After=network.target
        [Service]
        Type=simple
        User=pi
        WorkingDirectory=/opt/holobox
        ExecStart=python /opt/holobox/streamlined_camera_api.py --host 0.0.0.0 --port 8000
        Restart=on-failure
        RestartSec=5
        [Install]
        WantedBy=multi-user.target
        UNIT
        sudo systemctl daemon-reload
        sudo systemctl enable --now "$SERVICE"
        REG
        chmod +x /opt/holobox/registerservice.sh
        # ---------- end embedded scripts ----------

        cat <<'INFO' > /usr/local/bin/holobox-info
        #!/bin/bash
        echo "HoloBox System Information"
        echo "=========================="
        systemctl status holobox-camera.service --no-pager -l
        ip addr show wlan0 2>/dev/null || echo "wlan0 not available"
        iwgetid 2>/dev/null || echo "Not connected to WiFi"
        tail -n 10 /var/log/holobox/camera.log 2>/dev/null || true
        INFO
        chmod +x /usr/local/bin/holobox-info

        cat <<'MOTD' > /etc/motd
        ╔══════════════════════════════════════════╗
        ║             HoloBox System               ║
        ╚══════════════════════════════════════════╝
        Web  : http://localhost:8000/static/
        AP   : openUC2-XXXXX-YYYYY (pass: holobox123)
        MOTD

        #rm -f /install_holobox.sh
        #rm -rf /opt/holobox-install
        apt-get clean
        rm -rf /var/lib/apt/lists/*
        CHROOT
        sudo chmod +x /tmp/rpi-root/install_holobox.sh
        sudo chroot /tmp/rpi-root /install_holobox.sh



    - name: Unmount
      run: |
        sudo sync
        sudo umount /tmp/rpi-root/dev/pts || true
        sudo umount /tmp/rpi-root/dev || true
        sudo umount /tmp/rpi-root/sys || true
        sudo umount /tmp/rpi-root/proc || true
        sudo umount /tmp/rpi-root/boot || true
        sudo umount /tmp/rpi-root || true
        sudo losetup -d /dev/loop0

    - name: Compress
      run: |
        DATE=$(date +%Y%m%d)
        zip -9 holobox-sdcard-${DATE}.img.zip rpi-os-lite.img
        ls -lh holobox-sdcard-${DATE}.img.zip

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: holobox-sdcard-*.img.zip
        body: HoloBox SD Card Image
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: holobox-sdcard-image
        path: holobox-sdcard-*.img.zip
        retention-days: 30
