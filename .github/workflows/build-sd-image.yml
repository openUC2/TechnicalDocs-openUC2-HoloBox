name: Build HoloBox SD Card Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/use (e.g. v1.2.3). If empty, an auto tag is generated."
        required: false
      prerelease:
        description: "Mark release as prerelease"
        required: false
        type: boolean
        default: false

jobs:
  build-sd-image:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME_BASE: holobox-sdcard


    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binfmt-support parted kpartx zip wget curl xz-utils

    - name: Download RPi OS Lite 64 (Bookworm)
      run: |
        wget -O rpi-os-lite.img.xz https://downloads.raspberrypi.org/raspios_lite_arm64/images/raspios_lite_arm64-2024-03-15/2024-03-15-raspios-bookworm-arm64-lite.img.xz
        xz -d rpi-os-lite.img.xz

    - name: Expand image
      run: |
        dd if=/dev/zero bs=1M count=2048 >> rpi-os-lite.img
        sudo losetup -P /dev/loop0 rpi-os-lite.img
        sudo parted /dev/loop0 resizepart 2 100%
        sudo e2fsck -f -y -v /dev/loop0p2 || echo "e2fsck warnings ignored"
        sudo resize2fs /dev/loop0p2

    - name: Mount / chroot
      run: |
        mkdir -p /tmp/rpi-root
        sudo mount /dev/loop0p2 /tmp/rpi-root
        sudo mkdir -p /tmp/rpi-root/boot/firmware
        sudo mount /dev/loop0p1 /tmp/rpi-root/boot/firmware
        sudo cp /usr/bin/qemu-aarch64-static /tmp/rpi-root/usr/bin/
        sudo mount -t proc proc /tmp/rpi-root/proc
        sudo mount -t sysfs sysfs /tmp/rpi-root/sys
        sudo mount --bind /dev /tmp/rpi-root/dev
        sudo mount --bind /dev/pts /tmp/rpi-root/dev/pts
        sudo mkdir -p /tmp/rpi-root/opt/holobox-install
        sudo cp -r Software/* /tmp/rpi-root/opt/holobox-install/ || true

    - name: Install in chroot
      run: |
        cat <<'CHROOT' | sudo tee /tmp/rpi-root/install_holobox.sh
        #!/usr/bin/env bash
        set -e

        export DEBIAN_FRONTEND=noninteractive
        echo "nameserver 8.8.8.8" > /etc/resolv.conf
        apt-get update
        apt-get install -y python3 python3-pip hostapd dnsmasq iptables-persistent wpasupplicant git curl wget \
                          build-essential libcap-dev pkg-config python3-dev python3-picamera2 

        apt-get install -y \
          python3 python3-pip python3-dev build-essential pkg-config \
          hostapd dnsmasq   \
          wpasupplicant git curl wget python3-picamera2 \
            libcap-dev

        apt-get install -y rfkill iproute2 nftables python3-prctl # libcap2-dev libcamera0 libcamera-apps
        
        # --- User / auto-login / SSH (Bookworm boot path is /boot/firmware) ---
        if ! id pi >/dev/null 2>&1; then useradd -m -s /bin/bash -G sudo,video,gpio,i2c,spi,dialout pi; fi
        echo "pi:youseetoo" | chpasswd
        
        # Add capability to bind to privileged ports for pi user
        # This allows the camera API to bind to ports 80/443 without sudo
        apt-get install -y libcap2-bin
        setcap 'cap_net_bind_service=+ep' /usr/bin/python3.11 || echo "Warning: Could not set capability for Python"
        
        # Configure auto-login for getty on tty1
        mkdir -p /etc/systemd/system/getty@tty1.service.d
        cat > /etc/systemd/system/getty@tty1.service.d/autologin.conf << 'AUTOLOGIN'
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin pi --noclear %I $TERM
        AUTOLOGIN
        
        # Configure auto-login for serial console (optional but good for debugging)
        mkdir -p /etc/systemd/system/serial-getty@ttyS0.service.d
        cat > /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf << 'SERIALAUTOLOGIN'
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin pi --noclear %I 115200,38400,9600 vt102
        SERIALAUTOLOGIN
        
        # Disable and mask the first-boot user configuration wizards
        systemctl disable userconfig.service 2>/dev/null || true
        systemctl mask userconfig.service 2>/dev/null || true
        systemctl disable piwiz.service 2>/dev/null || true
        systemctl mask piwiz.service 2>/dev/null || true
        
        # Enable SSH
        touch /boot/firmware/ssh
        
        # Set up user credentials for first boot (Bookworm requirement)
        echo "pi:\$6\$rounds=656000\$YQKNpEXgsKpKhJoY\$u2LpKU3xd5JchlREtd/qXhBUOEIgM/gDp0tOk3gGnfEh76VjZcB6g7wXP2.7v3vA.T8u6pzOgKaFEaVZQMdtX0" > /boot/firmware/userconf.txt

        # --- App install ---
        mkdir -p /opt/holobox
        chown pi:pi /opt/holobox
        if [ -d /opt/holobox-install ]; then
          cp -r /opt/holobox-install/* /opt/holobox/ || true
          chown -R pi:pi /opt/holobox
          chmod +x /opt/holobox/*.sh || true
        fi
        cd /opt/holobox || true
        pip install --break-system-packages \
          fastapi==0.110.0 uvicorn[standard]==0.29.0 numpy==1.26.4 \
          opencv-python-headless==4.10.0.82 pydantic==2.7.1 || true
        # Install picamera2 without deps to avoid rebuilding python-prctl/libcamera
        pip install picamera2 --force-reinstall --break-system-packages
        pip install numpy==1.26.4 --break-system-packages

        # Set capability for Python to bind to privileged ports (after pip installs)
        which python3.11 && setcap 'cap_net_bind_service=+ep' $(which python3.11) || echo "Warning: Could not set capability for python3.11"
        which python3 && setcap 'cap_net_bind_service=+ep' $(which python3) || echo "Warning: Could not set capability for python3"


        mkdir -p /var/log/holobox
        chown pi:pi /var/log/holobox
        cat <<'UNIT' > /etc/systemd/system/holobox-camera.service
        [Unit]
        Description=HoloBox Camera API Server
        After=network.target
        [Service]
        Type=simple
        User=pi
        WorkingDirectory=/opt/holobox
        ExecStart=/usr/bin/python3 /opt/holobox/streamlined_camera_api.py --host 0.0.0.0 --port 80 --no-ssl
        Restart=on-failure
        RestartSec=5
        StandardOutput=append:/var/log/holobox/camera.log
        StandardError=append:/var/log/holobox/camera.log
        [Install]
        WantedBy=multi-user.target
        UNIT
        systemctl enable holobox-camera.service
        systemctl enable ssh

        # --- Make NetworkManager ignore wlan0 (critical for AP) ---
        mkdir -p /etc/NetworkManager/conf.d
        cat > /etc/NetworkManager/conf.d/99-unmanaged-wlan0.conf << 'NM'
        [keyfile]
        unmanaged-devices=interface-name:wlan0
        NM
        
        # Also create the main NetworkManager config to ensure it doesn't interfere
        cat > /etc/NetworkManager/NetworkManager.conf << 'NMCONF'
        [main]
        plugins=ifupdown,keyfile
        
        [ifupdown]
        managed=false
        NMCONF

        # --- Don’t let wpa_supplicant grab wlan0 while in AP mode ---
        systemctl disable wpa_supplicant.service wpa_supplicant@wlan0.service 2>/dev/null || true
        systemctl mask wpa_supplicant.service wpa_supplicant@wlan0.service 2>/dev/null || true

        # --- SSID generator (runtime, MAC-based, first-boot) ---
        install -d /etc/holobox
        cat <<'PY' > /usr/local/bin/holobox-generate-ssid
        #!/usr/bin/env python3
        import hashlib, pathlib, sys
        ADJ=["Bright","Clear","Focus","Sharp","Zoom","Light","Flash","Lens","Image","Photo","Pixel","Frame","View","Scope","Beam","Wave","Crystal","Prism","Filter","Mirror","Optic","Laser","Holo","Ray","Spectrum","Digital","Micro","Macro","Ultra","Super","Nano","Mini"]
        NOUN=["Box","Cam","Lab","Scope","Lens","Beam","Wave","Light","Focus","View","Snap","Shot","Frame","Pixel","Image","Photo","Optic","Prism","Mirror","Filter","Ray","Laser","Holo","Spectrum","Micro","Macro","Unit","Device","System","Tool","Cube","Capsule","Pod"]
        def mac(path='/sys/class/net/wlan0/address'):
            return pathlib.Path(path).read_text().strip()
        m = bytes.fromhex(mac().replace(':',''))
        h = hashlib.sha256(m).digest()
        ssid = f"openUC2-{ADJ[((h[0]<<8)|h[1])%len(ADJ)]}-{NOUN[((h[2]<<8)|h[3])%len(NOUN)]}"
        print(ssid)
        PY
        chmod +x /usr/local/bin/holobox-generate-ssid

        # Write hostapd.conf at first boot with MAC-based SSID
        cat > /usr/local/bin/holobox-configure-ap <<'AP'
        #!/bin/bash
        set -e
        
        # Log to syslog for debugging
        exec 1> >(logger -s -t holobox-configure-ap) 2>&1
        
        echo "Starting HoloBox AP configuration..."
        
        PASSPHRASE="holobox123"
        SSID_FILE="/etc/holobox/ssid"
        
        # Wait for wlan0 to be available
        for i in {1..10}; do
          if [ -e /sys/class/net/wlan0/address ]; then
            echo "wlan0 interface found"
            break
          fi
          echo "Waiting for wlan0... attempt $i/10"
          sleep 1
        done
        
        if [ ! -e /sys/class/net/wlan0/address ]; then
          echo "ERROR: wlan0 not found after 10 seconds"
          exit 1
        fi
        
        if [ ! -s "$SSID_FILE" ]; then
          SSID="$(/usr/local/bin/holobox-generate-ssid)"
          echo "Generated new SSID: $SSID"
          echo "$SSID" > "$SSID_FILE"
        else
          SSID="$(cat "$SSID_FILE")"
          echo "Using existing SSID: $SSID"
        fi
        
        install -d /etc/hostapd
        cat > /etc/hostapd/hostapd.conf <<EOF
        interface=wlan0
        driver=nl80211
        ssid=${SSID}
        hw_mode=g
        channel=6
        wmm_enabled=1
        macaddr_acl=0
        auth_algs=1
        ignore_broadcast_ssid=0
        wpa=2
        wpa_passphrase=${PASSPHRASE}
        wpa_key_mgmt=WPA-PSK
        wpa_pairwise=TKIP
        rsn_pairwise=CCMP
        country_code=DK
        ieee80211d=1
        ieee80211n=1
        EOF
        
        echo 'DAEMON_CONF="/etc/hostapd/hostapd.conf"' > /etc/default/hostapd
        
        echo "HoloBox AP configuration completed successfully"
        echo "SSID: $SSID"
        echo "Password: $PASSPHRASE"
        AP
        chmod +x /usr/local/bin/holobox-configure-ap

        # --- dnsmasq ---
        mkdir -p /etc/dnsmasq.d
        cat > /etc/dnsmasq.d/holobox-ap.conf <<'DNS'
        interface=wlan0
        bind-interfaces
        dhcp-range=192.168.4.2,192.168.4.200,255.255.255.0,24h
        domain=holobox.local
        local=/holobox.local/
        no-resolv
        server=8.8.8.8
        server=8.8.4.4
        DNS

        # --- IP forwarding + nftables NAT ---
        echo 'net.ipv4.ip_forward=1' > /etc/sysctl.d/99-holobox-ipforward.conf
        cat > /etc/nftables.conf <<'NFT'
        flush ruleset
        table inet filter {
          chain forward {
            type filter hook forward priority 0;
            policy drop;
            iifname "wlan0" oifname "eth0" accept
            iifname "eth0" oifname "wlan0" ct state related,established accept
          }
        }
        table ip nat {
          chain postrouting {
            type nat hook postrouting priority 100;
            oifname "eth0" masquerade
          }
        }
        NFT
        systemctl enable nftables


        # --- Prepare wlan0 before hostapd/dnsmasq on boot ---
        cat > /etc/systemd/system/holobox-hotspot.service <<'HOTSPOT'
        [Unit]
        Description=Prepare wlan0 for HoloBox AP
        After=network-online.target
        Wants=network-online.target
        Before=hostapd.service dnsmasq.service
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/bin/bash -c 'rfkill unblock all || true'
        ExecStart=/bin/bash -c 'sleep 2'
        ExecStart=/bin/bash -c 'nmcli dev set wlan0 managed no 2>/dev/null || true'
        ExecStart=/bin/bash -c 'sleep 1'
        ExecStart=/bin/bash -c 'ip link set wlan0 down || true'
        ExecStart=/bin/bash -c 'ip addr flush dev wlan0 || true'
        ExecStart=/bin/bash -c 'ip addr add 192.168.4.1/24 dev wlan0 || true'
        ExecStart=/bin/bash -c 'ip link set wlan0 up || true'
        ExecStart=/usr/local/bin/holobox-configure-ap
        [Install]
        WantedBy=multi-user.target
        HOTSPOT
        systemctl enable holobox-hotspot.service
        systemctl enable hostapd
        systemctl enable dnsmasq

        # --- Info helper ---
        cat <<'INFO' > /usr/local/bin/holobox-info
        #!/bin/bash
        echo "╔══════════════════════════════════════════╗"
        echo "║         HoloBox System Information       ║"
        echo "╚══════════════════════════════════════════╝"
        echo ""
        echo "Services Status:"
        systemctl is-active hostapd >/dev/null 2>&1 && echo "  ✓ hostapd: active" || echo "  ✗ hostapd: inactive"
        systemctl is-active dnsmasq >/dev/null 2>&1 && echo "  ✓ dnsmasq: active" || echo "  ✗ dnsmasq: inactive"
        systemctl is-active nftables >/dev/null 2>&1 && echo "  ✓ nftables: active" || echo "  ✗ nftables: inactive"
        systemctl is-active holobox-camera >/dev/null 2>&1 && echo "  ✓ holobox-camera: active" || echo "  ✗ holobox-camera: inactive"
        systemctl is-active holobox-hotspot >/dev/null 2>&1 && echo "  ✓ holobox-hotspot: active" || echo "  ✗ holobox-hotspot: inactive"
        echo ""
        echo "Network Configuration:"
        if [ -e /sys/class/net/wlan0/address ]; then
          WLAN_IP=$(ip addr show wlan0 2>/dev/null | sed -n 's/^\s*inet\s\+\([0-9.\/]\+\).*/\1/p')
          [ -n "$WLAN_IP" ] && echo "  wlan0 IP: $WLAN_IP" || echo "  wlan0 IP: not configured"
          SSID=$(iw dev wlan0 info 2>/dev/null | sed -n 's/^\s\+ssid\s\+\(.*\)$/\1/p')
          [ -n "$SSID" ] && echo "  SSID: $SSID" || echo "  SSID: not broadcasting"
        else
          echo "  wlan0: not available"
        fi
        
        if [ -f /etc/holobox/ssid ]; then
          echo "  Configured SSID: $(cat /etc/holobox/ssid)"
          echo "  WiFi Password: holobox123"
        fi
        
        echo ""
        echo "Access Information:"
        echo "  Web Interface: http://192.168.4.1/"
        echo "  Camera API: http://192.168.4.1:80/"
        echo ""
        echo "Troubleshooting:"
        echo "  View logs: sudo journalctl -u holobox-hotspot -u hostapd -u dnsmasq"
        echo "  Restart AP: sudo systemctl restart holobox-hotspot hostapd dnsmasq"
        echo ""
        INFO
        chmod +x /usr/local/bin/holobox-info
        
        # Add info display to user's bashrc
        cat >> /home/pi/.bashrc <<'BASHRC'
        
        # Display HoloBox info on login
        if [ -x /usr/local/bin/holobox-info ]; then
          /usr/local/bin/holobox-info
        fi
        BASHRC
        chown pi:pi /home/pi/.bashrc

        systemctl daemon-reload
        CHROOT
        sudo chmod +x /tmp/rpi-root/install_holobox.sh
        sudo chroot /tmp/rpi-root /install_holobox.sh

    - name: Unmount
      run: |
        sudo sync
        sudo umount /tmp/rpi-root/dev/pts || true
        sudo umount /tmp/rpi-root/dev || true
        sudo umount /tmp/rpi-root/sys || true
        sudo umount /tmp/rpi-root/proc || true
        sudo umount /tmp/rpi-root/boot/firmware || true
        sudo umount /tmp/rpi-root || true
        sudo losetup -d /dev/loop0

    - name: Compress
      run: |
        DATE=$(date +%Y%m%d)
        zip -9 holobox-sdcard-${DATE}.img.zip rpi-os-lite.img
        ls -lh holobox-sdcard-${DATE}.img.zip

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: holobox-sdcard-*.img.zip
        body: HoloBox SD Card Image
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: holobox-sdcard-image
        path: holobox-sdcard-*.img.zip
        retention-days: 30

    # Compute the release tag for both tag-push and workflow_dispatch
    - name: Compute tag
      id: tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
        elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
          TAG="${{ github.event.inputs.tag }}"
        else
          TAG="v$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "TAG=$TAG" >> "$GITHUB_ENV"

    # Create or update the GitHub Release and upload asset
    - name: Release (create/update and upload asset)
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.tag.outputs.tag }}
        name: HoloBox ${{ steps.tag.outputs.tag }}
        body: HoloBox SD Card Image
        prerelease: ${{ github.event.inputs.prerelease || false }}
        allowUpdates: true
        replacesArtifacts: false
        artifacts: "holobox-sdcard-*.img.zip"
        artifactContentType: application/zip
        token: ${{ secrets.GITHUB_TOKEN }}
