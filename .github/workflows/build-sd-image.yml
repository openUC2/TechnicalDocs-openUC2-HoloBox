name: Build HoloBox SD Card Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-sd-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binfmt-support parted kpartx zip wget curl xz-utils

    - name: Download RPi OS Lite 64 (Bookworm)
      run: |
        wget -O rpi-os-lite.img.xz https://downloads.raspberrypi.org/raspios_lite_arm64/images/raspios_lite_arm64-2024-03-15/2024-03-15-raspios-bookworm-arm64-lite.img.xz
        xz -d rpi-os-lite.img.xz

    - name: Expand image
      run: |
        dd if=/dev/zero bs=1M count=2048 >> rpi-os-lite.img
        sudo losetup -P /dev/loop0 rpi-os-lite.img
        sudo parted /dev/loop0 resizepart 2 100%
        sudo e2fsck -f -y -v /dev/loop0p2 || echo "e2fsck warnings ignored"
        sudo resize2fs /dev/loop0p2

    - name: Mount / chroot
      run: |
        mkdir -p /tmp/rpi-root
        sudo mount /dev/loop0p2 /tmp/rpi-root
        sudo mkdir -p /tmp/rpi-root/boot/firmware
        sudo mount /dev/loop0p1 /tmp/rpi-root/boot/firmware
        sudo cp /usr/bin/qemu-aarch64-static /tmp/rpi-root/usr/bin/
        sudo mount -t proc proc /tmp/rpi-root/proc
        sudo mount -t sysfs sysfs /tmp/rpi-root/sys
        sudo mount --bind /dev /tmp/rpi-root/dev
        sudo mount --bind /dev/pts /tmp/rpi-root/dev/pts
        sudo mkdir -p /tmp/rpi-root/opt/holobox-install
        sudo cp -r Software/* /tmp/rpi-root/opt/holobox-install/ || true

    - name: Install in chroot
      run: |
        cat <<'CHROOT' | sudo tee /tmp/rpi-root/install_holobox.sh
        #!/usr/bin/env bash
        set -euo pipefail

        export DEBIAN_FRONTEND=noninteractive
        echo "nameserver 8.8.8.8" > /etc/resolv.conf
        apt-get update
        apt-get install -y --no-install-recommends \
          python3 python3-pip python3-dev build-essential pkg-config \
          hostapd dnsmasq rfkill iproute2 nftables \
          wpasupplicant git curl wget python3-picamera2 \
          python3-prctl libcap2-dev

        # --- User / auto-login / SSH (Bookworm boot path is /boot/firmware) ---
        if ! id pi >/dev/null 2>&1; then useradd -m -s /bin/bash -G sudo pi; fi
        echo "pi:youseetoo" | chpasswd
        mkdir -p /etc/systemd/system/getty@tty1.service.d
        cat > /etc/systemd/system/getty@tty1.service.d/autologin.conf << 'AUTOLOGIN'
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin pi --noclear %I $TERM
        AUTOLOGIN
        systemctl disable userconfig.service 2>/dev/null || true
        systemctl mask userconfig.service 2>/dev/null || true
        systemctl disable piwiz.service 2>/dev/null || true
        systemctl mask piwiz.service 2>/dev/null || true
        touch /boot/firmware/ssh
        echo "pi:\$6\$rounds=656000\$YQKNpEXgsKpKhJoY\$u2LpKU3xd5JchlREtd/qXhBUOEIgM/gDp0tOk3gGnfEh76VjZcB6g7wXP2.7v3vA.T8u6pzOgKaFEaVZQMdtX0" > /boot/firmware/userconf.txt

        # --- App install ---
        mkdir -p /opt/holobox
        chown pi:pi /opt/holobox
        if [ -d /opt/holobox-install ]; then
          cp -r /opt/holobox-install/* /opt/holobox/ || true
          chown -R pi:pi /opt/holobox
          chmod +x /opt/holobox/*.sh || true
        fi
        cd /opt/holobox || true
        pip install --break-system-packages \
          fastapi==0.110.0 uvicorn[standard]==0.29.0 numpy==1.26.4 \
          opencv-python-headless==4.10.0.82 pydantic==2.7.1 || true
        pip install --force-reinstall --break-system-packages picamera2 || true
        pip install --break-system-packages numpy==1.26.4 || true

        mkdir -p /var/log/holobox
        chown pi:pi /var/log/holobox
        cat <<'UNIT' > /etc/systemd/system/holobox-camera.service
        [Unit]
        Description=HoloBox Camera API Server
        After=network.target
        [Service]
        Type=simple
        User=pi
        WorkingDirectory=/opt/holobox
        ExecStart=python /opt/holobox/streamlined_camera_api.py --host 0.0.0.0 --port 8001
        Restart=on-failure
        RestartSec=5
        StandardOutput=append:/var/log/holobox/camera.log
        StandardError=append:/var/log/holobox/camera.log
        [Install]
        WantedBy=multi-user.target
        UNIT
        systemctl enable holobox-camera.service
        systemctl enable ssh

        # --- Make NetworkManager ignore wlan0 (critical for AP) ---
        mkdir -p /etc/NetworkManager/conf.d
        cat > /etc/NetworkManager/conf.d/99-unmanaged-wlan0.conf << 'NM'
        [keyfile]
        unmanaged-devices=interface-name:wlan0
        NM

        # --- Don’t let wpa_supplicant grab wlan0 while in AP mode ---
        systemctl disable wpa_supplicant.service 2>/dev/null || true
        systemctl mask wpa_supplicant.service 2>/dev/null || true
        systemctl mask wpa_supplicant@wlan0.service 2>/dev/null || true

        # --- SSID generator ---
        cat <<'SSIDGEN' > /opt/holobox/generate_ssid.py
        #!/usr/bin/env python3
        import hashlib, os, sys
        ADJ=["Bright","Clear","Focus","Sharp","Zoom","Light","Flash","Lens","Image","Photo","Pixel","Frame","View","Scope","Beam","Wave","Crystal","Prism","Filter","Mirror","Optic","Laser","Holo","Ray","Spectrum","Digital","Micro","Macro","Ultra","Super","Nano","Mini"]
        NOUN=["Box","Cam","Lab","Scope","Lens","Beam","Wave","Light","Focus","View","Snap","Shot","Frame","Pixel","Image","Photo","Optic","Prism","Mirror","Filter","Ray","Laser","Holo","Spectrum","Micro","Macro","Unit","Device","System","Tool","Cube","Capsule","Pod"]
        def mac(iface='wlan0'):
            try: return open(f'/sys/class/net/{iface}/address').read().strip()
            except: h=hashlib.md5(os.uname().nodename.encode()).hexdigest()[:12]; return ':'.join([h[i:i+2] for i in range(0,12,2)])
        def gen(iface='wlan0'):
            m=bytes.fromhex(mac(iface).replace(':','')); h=hashlib.sha256(m).digest()
            return f"openUC2-{ADJ[((h[0]<<8)|h[1])%len(ADJ)]}-{NOUN[((h[2]<<8)|h[3])%len(NOUN)]}"
        if __name__=='__main__': print(gen(sys.argv[1] if len(sys.argv)>1 else 'wlan0'))
        SSIDGEN
        chmod +x /opt/holobox/generate_ssid.py
        SSID="$(/opt/holobox/generate_ssid.py wlan0 || echo openUC2-$(hostname | tail -c 5))"
        PASSPHRASE="holobox123"

        # --- hostapd ---
        mkdir -p /etc/hostapd
        cat > /etc/hostapd/hostapd.conf <<EOF
        interface=wlan0
        driver=nl80211
        ssid=${SSID}
        hw_mode=g
        channel=6
        wmm_enabled=1
        macaddr_acl=0
        auth_algs=1
        ignore_broadcast_ssid=0
        wpa=2
        wpa_passphrase=${PASSPHRASE}
        wpa_key_mgmt=WPA-PSK
        wpa_pairwise=TKIP
        rsn_pairwise=CCMP
        country_code=DK
        ieee80211d=1
        ieee80211n=1
        EOF
        echo 'DAEMON_CONF="/etc/hostapd/hostapd.conf"' > /etc/default/hostapd

        # --- dnsmasq ---
        mkdir -p /etc/dnsmasq.d
        cat > /etc/dnsmasq.d/holobox-ap.conf <<'DNS'
        interface=wlan0
        bind-interfaces
        dhcp-range=192.168.4.2,192.168.4.200,255.255.255.0,24h
        domain=holobox.local
        local=/holobox.local/
        no-resolv
        server=8.8.8.8
        server=8.8.4.4
        DNS

        # --- IP forwarding + nftables NAT (no firewall commands at build time) ---
        echo 'net.ipv4.ip_forward=1' > /etc/sysctl.d/99-holobox-ipforward.conf

        cat > /etc/nftables.conf <<'NFT'
        flush ruleset
        table inet filter {
          chain forward {
            type filter hook forward priority 0;
            policy drop;
            iifname "wlan0" oifname "eth0" accept
            iifname "eth0" oifname "wlan0" ct state related,established accept
          }
        }
        table ip nat {
          chain postrouting {
            type nat hook postrouting priority 100;
            oifname "eth0" masquerade
          }
        }
        NFT
        systemctl enable nftables

        # --- Prepare wlan0 before hostapd/dnsmasq on boot ---
        cat > /etc/systemd/system/holobox-hotspot.service <<'HOTSPOT'
        [Unit]
        Description=Prepare wlan0 for HoloBox AP
        After=NetworkManager.service network-online.target
        Wants=NetworkManager.service
        Before=hostapd.service dnsmasq.service
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/bin/bash -c 'rfkill unblock all || true'
        ExecStart=/bin/bash -c 'nmcli dev set wlan0 managed no 2>/dev/null || true'
        ExecStart=/bin/sleep 4
        ExecStart=/bin/bash -c 'ip link set wlan0 down || true'
        ExecStart=/bin/bash -c 'ip addr flush dev wlan0 || true'
        ExecStart=/bin/bash -c 'ip addr add 192.168.4.1/24 dev wlan0 || true'
        ExecStart=/bin/bash -c 'ip link set wlan0 up || true'
        [Install]
        WantedBy=multi-user.target
        HOTSPOT
        systemctl enable holobox-hotspot.service
        systemctl enable hostapd
        systemctl enable dnsmasq

        # --- Info helper ---
        cat <<'INFO' > /usr/local/bin/holobox-info
        #!/bin/bash
        echo "HoloBox System Information"
        echo "=========================="
        systemctl is-active hostapd && echo "hostapd: active" || echo "hostapd: inactive"
        systemctl is-active dnsmasq && echo "dnsmasq: active" || echo "dnsmasq: inactive"
        systemctl is-active nftables && echo "nftables: active" || echo "nftables: inactive"
        ip addr show wlan0 2>/dev/null | sed -n 's/^\s*inet\s\+\([0-9.\/]\+\).*/wlan0 IP: \1/p'
        iw dev wlan0 info 2>/dev/null | sed -n 's/^\s\+ssid\ \+\(.*\)$/SSID: \1/p'
        INFO
        chmod +x /usr/local/bin/holobox-info

        systemctl daemon-reload
        CHROOT
        sudo chmod +x /tmp/rpi-root/install_holobox.sh
        sudo chroot /tmp/rpi-root /install_holobox.sh

    - name: Unmount
      run: |
        sudo sync
        sudo umount /tmp/rpi-root/dev/pts || true
        sudo umount /tmp/rpi-root/dev || true
        sudo umount /tmp/rpi-root/sys || true
        sudo umount /tmp/rpi-root/proc || true
        sudo umount /tmp/rpi-root/boot/firmware || true
        sudo umount /tmp/rpi-root || true
        sudo losetup -d /dev/loop0

    - name: Compress
      run: |
        DATE=$(date +%Y%m%d)
        zip -9 holobox-sdcard-${DATE}.img.zip rpi-os-lite.img
        ls -lh holobox-sdcard-${DATE}.img.zip

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: holobox-sdcard-*.img.zip
        body: HoloBox SD Card Image
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: holobox-sdcard-image
        path: holobox-sdcard-*.img.zip
        retention-days: 30
