name: Build HoloBox SD Card Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-sd-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binfmt-support parted kpartx zip wget curl xz-utils

    - name: Download RPi OS Lite 64 (Bookworm)
      run: |
        wget -O rpi-os-lite.img.xz https://downloads.raspberrypi.org/raspios_lite_arm64/images/raspios_lite_arm64-2024-03-15/2024-03-15-raspios-bookworm-arm64-lite.img.xz
        xz -d rpi-os-lite.img.xz

    - name: Expand image
      run: |
        dd if=/dev/zero bs=1M count=2048 >> rpi-os-lite.img
        sudo losetup -P /dev/loop0 rpi-os-lite.img
        sudo parted /dev/loop0 resizepart 2 100%
        sudo e2fsck -f -y -v /dev/loop0p2 || echo "e2fsck completed with warnings/errors, continuing..."
        sudo resize2fs /dev/loop0p2

    - name: Mount / chroot
      run: |
        mkdir -p /tmp/rpi-root
        sudo mount /dev/loop0p2 /tmp/rpi-root
        # Bookworm mounts boot at /boot/firmware in the rootfs
        sudo mkdir -p /tmp/rpi-root/boot/firmware
        sudo mount /dev/loop0p1 /tmp/rpi-root/boot/firmware

        sudo cp /usr/bin/qemu-aarch64-static /tmp/rpi-root/usr/bin/
        sudo mount -t proc proc /tmp/rpi-root/proc
        sudo mount -t sysfs sysfs /tmp/rpi-root/sys
        sudo mount --bind /dev /tmp/rpi-root/dev
        sudo mount --bind /dev/pts /tmp/rpi-root/dev/pts

        sudo mkdir -p /tmp/rpi-root/opt/holobox-install
        sudo cp -r Software/* /tmp/rpi-root/opt/holobox-install/ || true

    - name: Install in chroot
      run: |
        cat <<'CHROOT' | sudo tee /tmp/rpi-root/install_holobox.sh
        #!/usr/bin/env bash
        set -euo pipefail

        # --- NOTE (root cause of AP not starting on Bookworm) ---
        # 1) NetworkManager manages wlan0 by default; hostapd/dnsmasq cannot claim the iface -> AP won't start.
        # 2) dhcpcd is not used by default on Bookworm; editing /etc/dhcpcd.conf has no effect.
        # 3) The previous setup_access_point.sh had a missing 'fi' and wasn't executed during image build.
        # 4) On Bookworm, boot partition is /boot/firmware; placing /boot/ssh in the wrong place prevents expected behavior.
        # This script fixes these by: marking wlan0 unmanaged by NM, not relying on dhcpcd, assigning IP via a oneshot
        # systemd service before hostapd/dnsmasq, and writing to /boot/firmware.

        echo "nameserver 8.8.8.8" > /etc/resolv.conf
        apt-get update
        apt-get install -y --no-install-recommends \
          python3 python3-pip python3-dev build-essential pkg-config \
          hostapd dnsmasq rfkill iproute2 iptables iptables-persistent \
          wpasupplicant git curl wget python3-picamera2 python3-prctl || true

        # ----- Users / login -----
        # Ensure 'pi' exists and can auto-login
        if ! id pi >/dev/null 2>&1; then
          useradd -m -s /bin/bash -G sudo pi
        fi
        echo "pi:youseetoo" | chpasswd

        mkdir -p /etc/systemd/system/getty@tty1.service.d
        cat > /etc/systemd/system/getty@tty1.service.d/autologin.conf << 'AUTOLOGIN'
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin pi --noclear %I $TERM
        AUTOLOGIN

        systemctl disable userconfig.service 2>/dev/null || true
        systemctl mask userconfig.service 2>/dev/null || true
        systemctl disable piwiz.service 2>/dev/null || true
        systemctl mask piwiz.service 2>/dev/null || true

        # Enable SSH headless (Bookworm: /boot/firmware)
        touch /boot/firmware/ssh
        # Provide userconf on boot partition as well
        echo "pi:\$6\$rounds=656000\$YQKNpEXgsKpKhJoY\$u2LpKU3xd5JchlREtd/qXhBUOEIgM/gDp0tOk3gGnfEh76VjZcB6g7wXP2.7v3vA.T8u6pzOgKaFEaVZQMdtX0" > /boot/firmware/userconf.txt

        # ----- App install -----
        mkdir -p /opt/holobox
        chown pi:pi /opt/holobox
        if [ -d /opt/holobox-install ]; then
          cp -r /opt/holobox-install/* /opt/holobox/ || true
          chown -R pi:pi /opt/holobox
          chmod +x /opt/holobox/*.sh || true
        fi

        cd /opt/holobox || true
        pip install --break-system-packages \
            fastapi==0.110.0 uvicorn[standard]==0.29.0 numpy==1.26.4 \
            opencv-python-headless==4.10.0.82 pydantic==2.7.1 || true
        pip install --force-reinstall --break-system-packages picamera2 || true
        pip install --break-system-packages numpy==1.26.4 || true

        mkdir -p /var/log/holobox
        chown pi:pi /var/log/holobox

        cat <<'UNIT' > /etc/systemd/system/holobox-camera.service
        [Unit]
        Description=HoloBox Camera API Server
        After=network.target

        [Service]
        Type=simple
        User=pi
        WorkingDirectory=/opt/holobox
        ExecStart=python /opt/holobox/streamlined_camera_api.py --host 0.0.0.0 --port 8001
        Restart=on-failure
        RestartSec=5
        StandardOutput=append:/var/log/holobox/camera.log
        StandardError=append:/var/log/holobox/camera.log

        [Install]
        WantedBy=multi-user.target
        UNIT
        systemctl enable holobox-camera.service
        systemctl enable ssh

        # ----- Network: make NM ignore wlan0 (critical for AP on Bookworm) -----
        mkdir -p /etc/NetworkManager/conf.d
        cat > /etc/NetworkManager/conf.d/99-unmanaged-wlan0.conf << 'NM'
        [keyfile]
        unmanaged-devices=interface-name:wlan0
        NM

        # Also prevent wpa_supplicant from grabbing wlan0 (AP mode uses hostapd)
        systemctl disable wpa_supplicant.service 2>/dev/null || true
        systemctl mask wpa_supplicant.service 2>/dev/null || true
        systemctl mask wpa_supplicant@wlan0.service 2>/dev/null || true

        # ----- Hostapd / dnsmasq config -----
        # SSID generator (deterministic from MAC)
        cat <<'SSIDGEN' > /opt/holobox/generate_ssid.py
        #!/usr/bin/env python3
        import hashlib, subprocess, sys, os
        ADJ = ["Bright","Clear","Focus","Sharp","Zoom","Light","Flash","Lens","Image","Photo","Pixel","Frame","View","Scope","Beam","Wave","Crystal","Prism","Filter","Mirror","Optic","Laser","Holo","Ray","Spectrum","Digital","Micro","Macro","Ultra","Super","Nano","Mini"]
        NOUN=["Box","Cam","Lab","Scope","Lens","Beam","Wave","Light","Focus","View","Snap","Shot","Frame","Pixel","Image","Photo","Optic","Prism","Mirror","Filter","Ray","Laser","Holo","Spectrum","Micro","Macro","Unit","Device","System","Tool","Cube","Capsule","Pod"]
        def mac(iface='wlan0'):
            try:
                return open(f'/sys/class/net/{iface}/address').read().strip()
            except:
                h = hashlib.md5(os.uname().nodename.encode()).hexdigest()[:12]
                return ':'.join([h[i:i+2] for i in range(0,12,2)])
        def gen(iface='wlan0'):
            m = bytes.fromhex(mac(iface).replace(':',''))
            h = hashlib.sha256(m).digest()
            return f"openUC2-{ADJ[((h[0]<<8)|h[1])%len(ADJ)]}-{NOUN[((h[2]<<8)|h[3])%len(NOUN)]}"
        if __name__=='__main__':
            iface=sys.argv[1] if len(sys.argv)>1 else 'wlan0'
            print(gen(iface))
        SSIDGEN
        chmod +x /opt/holobox/generate_ssid.py

        # Static AP parameters
        AP_IP="192.168.4.1"
        AP_NET="192.168.4.0/24"
        PASSPHRASE="holobox123"
        SSID="$(/opt/holobox/generate_ssid.py wlan0 || echo openUC2-$(hostname | tail -c 5))"

        # hostapd
        mkdir -p /etc/hostapd
        cat > /etc/hostapd/hostapd.conf <<EOF
        interface=wlan0
        driver=nl80211
        ssid=${SSID}
        hw_mode=g
        channel=6
        wmm_enabled=1
        macaddr_acl=0
        auth_algs=1
        ignore_broadcast_ssid=0
        wpa=2
        wpa_passphrase=${PASSPHRASE}
        wpa_key_mgmt=WPA-PSK
        wpa_pairwise=TKIP
        rsn_pairwise=CCMP
        country_code=DK
        ieee80211d=1
        ieee80211n=1
        EOF

        cat > /etc/default/hostapd <<'HDEF'
        DAEMON_CONF="/etc/hostapd/hostapd.conf"
        HDEF

        # dnsmasq
        cat > /etc/dnsmasq.d/holobox-ap.conf <<EOF
        interface=wlan0
        bind-interfaces
        dhcp-range=192.168.4.2,192.168.4.200,255.255.255.0,24h
        domain=holobox.local
        local=/holobox.local/
        no-resolv
        server=8.8.8.8
        server=8.8.4.4
        EOF

        # NAT (iptables -> saved for iptables-persistent)
        iptables -t nat -F POSTROUTING 2>/dev/null || true
        iptables -F FORWARD 2>/dev/null || true
        # Route outbound via eth0 if available; harmless otherwise
        iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE || true
        iptables -A FORWARD -i eth0 -o wlan0 -m state --state RELATED,ESTABLISHED -j ACCEPT || true
        iptables -A FORWARD -i wlan0 -o eth0 -j ACCEPT || true
        mkdir -p /etc/iptables
        iptables-save > /etc/iptables/rules.v4

        # oneshot service to prep wlan0 before hostapd/dnsmasq
        cat > /etc/systemd/system/holobox-hotspot.service <<'HOTSPOT'
        [Unit]
        Description=Prepare wlan0 for HoloBox AP (unmanage by NM, set IP, bring up)
        After=NetworkManager.service network.target
        Wants=NetworkManager.service
        Before=hostapd.service dnsmasq.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/bin/bash -c 'rfkill unblock all || true'
        ExecStart=/bin/bash -c 'nmcli dev set wlan0 managed no 2>/dev/null || true'
        ExecStart=/bin/bash -c 'ip link set wlan0 down || true'
        ExecStart=/bin/bash -c 'ip addr flush dev wlan0 || true'
        ExecStart=/bin/bash -c 'ip addr add 192.168.4.1/24 dev wlan0 || true'
        ExecStart=/bin/bash -c 'ip link set wlan0 up || true'

        [Install]
        WantedBy=multi-user.target
        HOTSPOT

        systemctl enable holobox-hotspot.service
        systemctl enable hostapd
        systemctl enable dnsmasq
        systemctl enable netfilter-persistent || true   # loads /etc/iptables/rules.v4 at boot

        # ----- helper scripts -----
        cat <<'AP' > /opt/holobox/setup_access_point.sh
        #!/usr/bin/env bash
        set -euo pipefail
        INTERFACE="wlan0"
        IP_RANGE="192.168.4.0/24"
        GATEWAY="192.168.4.1"
        PASSPHRASE="holobox123"
        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

        if [ -f "$SCRIPT_DIR/generate_ssid.py" ]; then
          SSID=$(python3 "$SCRIPT_DIR/generate_ssid.py" "$INTERFACE")
        else
          SSID="openUC2-$(hostname | tail -c 5)"
        fi

        echo "Setting up AP SSID=$SSID on $INTERFACE"

        # Make NM ignore wlan0 persistently
        mkdir -p /etc/NetworkManager/conf.d
        cat > /etc/NetworkManager/conf.d/99-unmanaged-wlan0.conf <<EOF
        [keyfile]
        unmanaged-devices=interface-name:$INTERFACE
        EOF

        systemctl stop hostapd dnsmasq wpa_supplicant 2>/dev/null || true
        systemctl disable wpa_supplicant 2>/dev/null || true
        systemctl mask wpa_supplicant 2>/dev/null || true

        # hostapd
        cat > /etc/hostapd/hostapd.conf <<EOF
        interface=$INTERFACE
        driver=nl80211
        ssid=$SSID
        hw_mode=g
        channel=6
        wmm_enabled=1
        macaddr_acl=0
        auth_algs=1
        ignore_broadcast_ssid=0
        wpa=2
        wpa_passphrase=$PASSPHRASE
        wpa_key_mgmt=WPA-PSK
        wpa_pairwise=TKIP
        rsn_pairwise=CCMP
        country_code=DK
        ieee80211d=1
        ieee80211n=1
        EOF
        echo 'DAEMON_CONF="/etc/hostapd/hostapd.conf"' > /etc/default/hostapd

        # dnsmasq
        cat > /etc/dnsmasq.d/holobox-ap.conf <<EOF
        interface=$INTERFACE
        bind-interfaces
        dhcp-range=192.168.4.2,192.168.4.200,255.255.255.0,24h
        domain=holobox.local
        local=/holobox.local/
        no-resolv
        server=8.8.8.8
        server=8.8.4.4
        EOF

        # IP + NAT
        ip link set $INTERFACE down || true
        ip addr flush dev $INTERFACE || true
        ip addr add ${GATEWAY}/24 dev $INTERFACE || true
        ip link set $INTERFACE up || true

        iptables -t nat -F POSTROUTING 2>/dev/null || true
        iptables -F FORWARD 2>/dev/null || true
        iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE || true
        iptables -A FORWARD -i eth0 -o $INTERFACE -m state --state RELATED,ESTABLISHED -j ACCEPT || true
        iptables -A FORWARD -i $INTERFACE -o eth0 -j ACCEPT || true
        iptables-save > /etc/iptables/rules.v4

        systemctl enable holobox-hotspot.service
        systemctl enable hostapd
        systemctl enable dnsmasq
        systemctl restart holobox-hotspot.service
        systemctl restart hostapd
        systemctl restart dnsmasq
        echo "AP configured."
        AP
        chmod +x /opt/holobox/setup_access_point.sh

        cat <<'WIFI' > /opt/holobox/setup_wifi_client.sh
        #!/usr/bin/env bash
        set -euo pipefail
        SSID=""; PASSPHRASE=""
        while [[ $# -gt 0 ]]; do
          case $1 in
            --ssid) SSID="$2"; shift 2 ;;
            --password) PASSPHRASE="$2"; shift 2 ;;
            *) echo "Usage: $0 --ssid NET --password PASS"; exit 1 ;;
          esac
        done
        [ -n "$SSID" ] && [ -n "$PASSPHRASE" ] || { echo "SSID and password required"; exit 1; }

        systemctl stop hostapd dnsmasq || true
        systemctl disable hostapd dnsmasq || true

        # Re-allow NM to manage wlan0 for client mode
        rm -f /etc/NetworkManager/conf.d/99-unmanaged-wlan0.conf
        systemctl restart NetworkManager || true

        cat > /etc/wpa_supplicant/wpa_supplicant.conf <<EOF
        country=DK
        ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
        update_config=1
        network={
          ssid="$SSID"
          psk="$PASSPHRASE"
        }
        EOF
        systemctl unmask wpa_supplicant.service || true
        systemctl enable wpa_supplicant || true
        echo "Client WiFi configured; reboot recommended."
        WIFI
        chmod +x /opt/holobox/setup_wifi_client.sh

        # Info helper
        cat <<'INFO' > /usr/local/bin/holobox-info
        #!/bin/bash
        echo "HoloBox System Information"
        echo "=========================="
        systemctl is-active hostapd && echo "hostapd: active" || echo "hostapd: inactive"
        systemctl is-active dnsmasq && echo "dnsmasq: active" || echo "dnsmasq: inactive"
        ip addr show wlan0 2>/dev/null | sed -n 's/^\s*inet\s\+\([0-9.\/]\+\).*/wlan0 IP: \1/p'
        iw dev wlan0 info 2>/dev/null | sed -n 's/^\s\+ssid\ \+\(.*\)$/SSID: \1/p'
        tail -n 20 /var/log/holobox/camera.log 2>/dev/null || true
        INFO
        chmod +x /usr/local/bin/holobox-info

        # Nice MOTD
        cat <<'MOTD' > /etc/motd
        ╔══════════════════════════════════════════╗
        ║             HoloBox System               ║
        ╚══════════════════════════════════════════╝
        Web  : http://localhost:8000/static/
        AP   : (auto) openUC2-<ADJ>-<NOUN>  pass: holobox123
        MOTD

        systemctl daemon-reload
        CHROOT
        sudo chmod +x /tmp/rpi-root/install_holobox.sh
        sudo chroot /tmp/rpi-root /install_holobox.sh

    - name: Unmount
      run: |
        sudo sync
        sudo umount /tmp/rpi-root/dev/pts || true
        sudo umount /tmp/rpi-root/dev || true
        sudo umount /tmp/rpi-root/sys || true
        sudo umount /tmp/rpi-root/proc || true
        sudo umount /tmp/rpi-root/boot/firmware || true
        sudo umount /tmp/rpi-root || true
        sudo losetup -d /dev/loop0

    - name: Compress
      run: |
        DATE=$(date +%Y%m%d)
        zip -9 holobox-sdcard-${DATE}.img.zip rpi-os-lite.img
        ls -lh holobox-sdcard-${DATE}.img.zip

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: holobox-sdcard-*.img.zip
        body: HoloBox SD Card Image
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: holobox-sdcard-image
        path: holobox-sdcard-*.img.zip
        retention-days: 30
