name: Build HoloBox SD Card Image (NetworkManager AP)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-sd-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binfmt-support parted kpartx zip wget curl xz-utils

    - name: Download RPi OS Lite 64 (Bookworm)
      run: |
        wget -O rpi-os-lite.img.xz https://downloads.raspberrypi.org/raspios_lite_arm64/images/raspios_lite_arm64-2024-03-15/2024-03-15-raspios-bookworm-arm64-lite.img.xz
        xz -d rpi-os-lite.img.xz

    - name: Expand image
      run: |
        dd if=/dev/zero bs=1M count=2048 >> rpi-os-lite.img
        sudo losetup -P /dev/loop0 rpi-os-lite.img
        sudo parted /dev/loop0 resizepart 2 100%
        sudo e2fsck -f -y -v /dev/loop0p2 || echo "e2fsck completed with warnings/errors, continuing..."
        sudo resize2fs /dev/loop0p2

    - name: Mount / chroot
      run: |
        mkdir -p /tmp/rpi-root
        sudo mount /dev/loop0p2 /tmp/rpi-root
        sudo mount /dev/loop0p1 /tmp/rpi-root/boot
        sudo cp /usr/bin/qemu-aarch64-static /tmp/rpi-root/usr/bin/
        sudo mount -t proc proc /tmp/rpi-root/proc
        sudo mount -t sysfs sysfs /tmp/rpi-root/sys
        sudo mount --bind /dev /tmp/rpi-root/dev
        sudo mount --bind /dev/pts /tmp/rpi-root/dev/pts

        sudo mkdir -p /tmp/rpi-root/opt/holobox-install
        sudo cp -r Software/* /tmp/rpi-root/opt/holobox-install/

    - name: Install in chroot (NetworkManager AP)
      run: |
        cat <<'CHROOT' | sudo tee /tmp/rpi-root/install_holobox.sh
        #!/usr/bin/env bash
        set -e

        # ensure DNS for chroot
        echo "nameserver 8.8.8.8" > /etc/resolv.conf

        apt-get update
        apt-get install -y \
          python3 python3-pip python3-dev build-essential pkg-config \
          python3-picamera2 \
          wpasupplicant network-manager openssh-server git curl wget

        # user 'pi'
        useradd -m -s /bin/bash pi || true
        usermod -aG sudo pi || true
        echo "pi:youseetoo" | chpasswd

        # holobox files
        mkdir -p /opt/holobox
        chown pi:pi /opt/holobox
        cp -r /opt/holobox-install/* /opt/holobox/ || true
        chown -R pi:pi /opt/holobox
        chmod +x /opt/holobox/*.sh || true

        # python deps
        cd /opt/holobox
        pip install --break-system-packages \
          fastapi==0.110.0 uvicorn[standard]==0.29.0 \
          numpy==1.26.4 opencv-python-headless==4.10.0.82 pydantic==2.7.1
        pip install --break-system-packages --force-reinstall picamera2
        pip install --break-system-packages numpy==1.26.4

        # logs
        mkdir -p /var/log/holobox
        chown pi:pi /var/log/holobox

        # holobox service
        cat <<'UNIT' > /etc/systemd/system/holobox-camera.service
        [Unit]
        Description=HoloBox Camera API Server
        After=network.target

        [Service]
        Type=simple
        User=pi
        WorkingDirectory=/opt/holobox
        ExecStart=python /opt/holobox/streamlined_camera_api.py --host 0.0.0.0 --port 8001
        Restart=on-failure
        RestartSec=5
        StandardOutput=append:/var/log/holobox/camera.log
        StandardError=append:/var/log/holobox/camera.log

        [Install]
        WantedBy=multi-user.target
        UNIT

        systemctl daemon-reload
        systemctl enable holobox-camera.service
        systemctl enable ssh

        # --- NetworkManager AP configuration (no hostapd/dnsmasq) ---
        # make sure NM is enabled; avoid conflicts if hostapd/dnsmasq preinstalled
        systemctl disable hostapd dnsmasq 2>/dev/null || true
        systemctl mask hostapd dnsmasq 2>/dev/null || true
        systemctl enable NetworkManager

        SSID="HoloBox-$(hostname | tail -c 5)"
        PASS="holobox123"
        IFACE="wlan0"

        # create/replace AP connection
        nmcli -t -f NAME connection show | grep -q '^holobox-ap$' && nmcli connection delete holobox-ap || true
        nmcli connection add type wifi ifname "$IFACE" con-name holobox-ap ssid "$SSID"
        nmcli connection modify holobox-ap \
          802-11-wireless.mode ap \
          802-11-wireless.band bg \
          802-11-wireless.channel 7 \
          wifi-sec.key-mgmt wpa-psk \
          wifi-sec.psk "$PASS" \
          ipv4.method shared \
          ipv4.addresses 192.168.4.1/24 \
          ipv4.gateway 192.168.4.1 \
          ipv6.method ignore \
          connection.autoconnect yes \
          connection.autoconnect-priority 100

        # ensure Wi-Fi radio isn't blocked at boot
        nmcli radio wifi on || true
        rfkill unblock wifi || true

        # helper
        cat <<'INFO' > /usr/local/bin/holobox-info
        #!/bin/bash
        echo "HoloBox System Information"
        echo "=========================="
        systemctl status holobox-camera.service --no-pager -l
        ip addr show wlan0 2>/dev/null || echo "wlan0 not available"
        nmcli -t -f NAME,DEVICE,TYPE,STATE connection show --active 2>/dev/null || true
        iwgetid 2>/dev/null || echo "Not connected to WiFi (client)"
        tail -n 20 /var/log/holobox/camera.log 2>/dev/null || true
        INFO
        chmod +x /usr/local/bin/holobox-info

        cat <<'MOTD' > /etc/motd
        ╔══════════════════════════════════════════╗
        ║             HoloBox System               ║
        ╚══════════════════════════════════════════╝
        Web  : http://localhost:8001/
        AP   : HoloBox-XXXXX  (pass: holobox123)
        AP IP: 192.168.4.1    (NM shared)
        MOTD

        # cleanup
        apt-get clean
        rm -rf /var/lib/apt/lists/*
        CHROOT
        sudo chmod +x /tmp/rpi-root/install_holobox.sh
        sudo chroot /tmp/rpi-root /install_holobox.sh

    - name: Unmount
      run: |
        sudo sync
        sudo umount /tmp/rpi-root/dev/pts || true
        sudo umount /tmp/rpi-root/dev || true
        sudo umount /tmp/rpi-root/sys || true
        sudo umount /tmp/rpi-root/proc || true
        sudo umount /tmp/rpi-root/boot || true
        sudo umount /tmp/rpi-root || true
        sudo losetup -d /dev/loop0

    - name: Compress
      run: |
        DATE=$(date +%Y%m%d)
        zip -9 "holobox-sdcard-${DATE}.img.zip" rpi-os-lite.img
        ls -lh "holobox-sdcard-${DATE}.img.zip"

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: holobox-sdcard-*.img.zip
        body: HoloBox SD Card Image (NetworkManager AP)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: holobox-sdcard-image
        path: holobox-sdcard-*.img.zip
        retention-days: 30
