name: Deploy JupyterLite

on:
  push:
    branches: [ main ]
    paths:
      - 'Software/**'
      - '.github/workflows/deploy-jupyter.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Software/**'
      - '.github/workflows/deploy-jupyter.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jupyterlite-core jupyterlite-xeus-python
        pip install numpy matplotlib scipy ipywidgets
        
    - name: Build JupyterLite site
      run: |
        cd Software
        jupyter lite build --contents content --output-dir dist
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: jupyterlite-site
        path: Software/dist/
        
    - name: Deploy to GitHub Pages (youseetoo.github.io/jupyter)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        personal_token: ${{ secrets.GITHUB_TOKEN }}
        external_repository: youseetoo/youseetoo.github.io
        publish_branch: main
        publish_dir: Software/dist
        destination_dir: jupyter
        commit_message: 'Deploy HoloBox Jupyter from ${{ github.sha }}'